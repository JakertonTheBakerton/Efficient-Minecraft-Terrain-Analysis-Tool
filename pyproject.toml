[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
 
[project]
name = "terrain-efficiency"
version = "0.1.0"
description = "Minecraft chunk data analysis for structural terrain efficiency"
requires-python = ">=3.10"
dependencies = [
    "anvil-parser2",
    "numpy",
    "pandas",
    "plotly",
]
 
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
 
[tool.setuptools.packages.find]
where = ["src"]